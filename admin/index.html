<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de gestión · Loureiro Soluciones</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin/admin.css?v=88836459">
</head>
<body>

<!-- ══ LOGIN ═══════════════════════════════════════════════════════════ -->
<div class="login" id="login">
  <div class="login__caja">
    <div class="login__marca">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 30V10l14-6 14 6v20" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M14 30V20h12v10" fill="none" stroke="#F97316" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <b>Loureiro<em>soluciones</em></b>
    </div>

    <h1 id="login-titulo">Panel de gestión</h1>
    <p class="login__sub" id="login-sub">Acceso restringido.</p>

    <div class="aviso aviso--err" id="login-aviso" hidden></div>

    <form id="login-form" novalidate>
      <div class="campo">
        <label for="li-email">Email</label>
        <input id="li-email" type="email" autocomplete="username" required
               placeholder="tu@correo.com">
      </div>
      <div class="campo">
        <label for="li-pass">Contraseña</label>
        <input id="li-pass" type="password" autocomplete="current-password" required>
      </div>
      <label class="check" for="li-recordar">
        <input type="checkbox" id="li-recordar" checked>
        <span>Mantener la sesión iniciada</span>
      </label>
      <button class="btn btn--amber btn--full" type="submit" id="li-btn">Entrar</button>
      <button type="button" class="login__link" id="li-olvido">He olvidado mi contraseña</button>
    </form>

    <form id="recuperar-form" novalidate hidden>
      <div class="campo">
        <label for="re-email">Tu correo</label>
        <input id="re-email" type="email" autocomplete="username" required>
      </div>
      <button class="btn btn--amber btn--full" type="submit" id="re-btn">Enviarme el enlace</button>
      <button type="button" class="login__link" id="re-volver">Volver a entrar</button>
    </form>

    <form id="clave-form" novalidate hidden>
      <p class="login__hola" id="cl-hola"></p>
      <div class="campo">
        <label for="cl-pass">Contraseña nueva</label>
        <input id="cl-pass" type="password" autocomplete="new-password" minlength="10" required>
        <small class="login__nota">Al menos 10 caracteres.</small>
      </div>
      <div class="campo">
        <label for="cl-pass2">Repítela</label>
        <input id="cl-pass2" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn--amber btn--full" type="submit" id="cl-btn">Guardar y entrar</button>
    </form>
  </div>
</div>

<!-- ══ APLICACIÓN ══════════════════════════════════════════════════════ -->
<div class="app" id="app" hidden>

  <aside class="lat" id="lat">
    <div class="lat__marca">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 30V10l14-6 14 6v20" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M14 30V20h12v10" fill="none" stroke="#F97316" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <b>Loureiro<em>soluciones</em></b>
    </div>

    <nav class="lat__nav" id="menu"></nav>

    <div class="lat__pie">
      <span id="sesion-email"></span>
      <button id="btn-salir">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="cab">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="movil-btn" id="btn-menu" aria-label="Menú">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="vista-titulo">Panel</h1>
          <p id="vista-sub"></p>
        </div>
      </div>
      <div class="cab__der">
        <div id="vista-acciones"></div>
        <div class="campana" id="campana">
          <button class="campana__btn" id="campana-btn" type="button"
                  aria-haspopup="true" aria-expanded="false" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
            <span class="campana__num" id="campana-num" hidden></span>
          </button>
          <div class="campana__panel" id="campana-panel" hidden></div>
        </div>
      </div>
    </div>

    <div id="vista"></div>
  </main>
</div>

<div id="modal-host"></div>

<script src="/admin/admin.js?v=c7b26798"></script>
</body>
</html>

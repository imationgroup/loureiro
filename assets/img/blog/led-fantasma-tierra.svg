<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Dos casas separadas, cada una con su propia toma de tierra. Una avería en la casa de la izquierda vierte corriente a su pica, la corriente se reparte por el terreno y llega a la pica de la casa vecina, que queda a unos voltios respecto a su neutro y hace brillar los LED apagados">
  <defs>
    <linearGradient id="lt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7F3"/><stop offset="1" stop-color="#F0EBE4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#lt-bg)"/>

  <!-- Terreno -->
  <rect x="0" y="252" width="800" height="148" fill="#EDE7DD"/>
  <path d="M0 252h800" stroke="#D6D0C6" stroke-width="3"/>
  <text x="40" y="382" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">El terreno conduce: no es un aislante perfecto</text>

  <!-- Casa 1 -->
  <path d="M70 150l90-62 90 62v102H70z" fill="#FFFFFF" stroke="#E0DBD2" stroke-width="3" stroke-linejoin="round"/>
  <text x="70" y="76" font-family="Inter, sans-serif" font-size="14" fill="#8A8E96">Casa del vecino</text>
  <rect x="120" y="170" width="80" height="60" rx="8" fill="#FFFFFF" stroke="#C8C3BA" stroke-width="3"/>
  <circle cx="160" cy="200" r="18" fill="none" stroke="#C8C3BA" stroke-width="3"/>
  <text x="96" y="248" font-family="Inter, sans-serif" font-size="13" fill="#F87171" font-weight="600">Avería: deriva a tierra</text>

  <!-- Pica 1 -->
  <path d="M160 252v58" stroke="#8A8E96" stroke-width="5" stroke-linecap="round"/>
  <path d="M148 310h24M152 320h16M156 330h8" stroke="#8A8E96" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="352" font-family="Inter, sans-serif" font-size="12" fill="#8A8E96">Su pica</text>

  <!-- Corriente por el terreno -->
  <path d="M170 318q170 46 330 0" stroke="#F2A81C" stroke-width="5" stroke-dasharray="10 8" fill="none" stroke-linecap="round"/>
  <text x="430" y="382" font-family="Inter, sans-serif" font-size="13" fill="#9A6A05">La corriente se reparte por el suelo</text>

  <!-- Anillos de potencial -->
  <g stroke="#F5C451" stroke-width="2" fill="none" opacity="0.8">
    <path d="M110 300q50 -24 100 0"/>
    <path d="M86 320q74 -34 148 0"/>
  </g>

  <!-- Casa 2 -->
  <path d="M550 150l90-62 90 62v102H550z" fill="#FFFFFF" stroke="#E0DBD2" stroke-width="3" stroke-linejoin="round"/>
  <text x="550" y="76" font-family="Inter, sans-serif" font-size="14" fill="#8A8E96">Tu casa</text>

  <!-- Bombilla LED -->
  <circle cx="640" cy="190" r="30" fill="#FEF3C7" opacity="0.55"/>
  <circle cx="640" cy="190" r="20" fill="#FFFFFF" stroke="#C8C3BA" stroke-width="3"/>
  <path d="M630 212h20M633 222h14" stroke="#C8C3BA" stroke-width="3" stroke-linecap="round"/>
  <text x="554" y="130" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46" font-weight="600">LED apagado</text>
  <text x="554" y="148" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46" font-weight="600">que brilla</text>

  <!-- Pica 2 -->
  <path d="M640 252v58" stroke="#8A8E96" stroke-width="5" stroke-linecap="round"/>
  <path d="M628 310h24M632 320h16M636 330h8" stroke="#8A8E96" stroke-width="4" stroke-linecap="round"/>
  <text x="596" y="352" font-family="Inter, sans-serif" font-size="12" fill="#8A8E96">Tu pica</text>

  <!-- Diferencia de potencial -->
  <path d="M640 244v-16" stroke="#F2A81C" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>
  <text x="672" y="286" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46" font-weight="600">Unos voltios</text>
  <text x="672" y="304" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">entre tu tierra</text>
  <text x="672" y="322" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">y tu neutro</text>
</svg>

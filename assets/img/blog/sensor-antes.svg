<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de un pasillo con las luces encendidas todo el día y un interruptor manual">
  <rect width="800" height="450" fill="#C6BFB4"/>
  <rect y="330" width="800" height="120" fill="#9B9289"/>

  <!-- Pasillo en perspectiva -->
  <path d="M0 0h800v330H0z" fill="#C6BFB4"/>
  <path d="M200 60h400v270H200z" fill="#B5AEA3"/>
  <path d="M200 60L0 0v330l200-60zM600 60l200-60v330l-200-60z" fill="#BDB6AB"/>

  <!-- Tres plafones encendidos innecesariamente -->
  <g>
    <circle cx="400" cy="90" r="16" fill="#EDE3C8"/>
    <circle cx="400" cy="150" r="13" fill="#EDE3C8"/>
    <circle cx="400" cy="200" r="10" fill="#EDE3C8"/>
  </g>
  <path d="M400 106l-46 224h92z" fill="#E4DAC0" opacity=".4"/>

  <!-- Interruptor manual lejos -->
  <rect x="82" y="196" width="70" height="70" rx="7" fill="#DDD2B8" stroke="#A99C80" stroke-width="4"/>
  <rect x="102" y="212" width="30" height="38" rx="4" fill="#C9BC9F"/>

  <!-- Contador girando: gasto -->
  <g transform="translate(640 200)">
    <rect width="110" height="80" rx="8" fill="#8A8178"/>
    <rect x="12" y="14" width="86" height="30" rx="4" fill="#E8E3DA"/>
    <text x="55" y="36" font-family="Inter, sans-serif" font-size="18" fill="#4A4F58" text-anchor="middle">24 h</text>
    <circle cx="55" cy="62" r="10" fill="#C2410C"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de una casa recién comprada: cajas de mudanza con las llaves, cuadro eléctrico nuevo, enchufes y lámpara">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de una lámpara colgante instalada correctamente, con luz cálida">
  <defs>
    <radialGradient id="ld-g" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFD9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#F4F1EC"/>
  <rect y="0" width="800" height="46" fill="#EAE5DC"/>

  <!-- Florón y cable textil -->
  <ellipse cx="400" cy="48" rx="34" ry="11" fill="#2B3039"/>
  <path d="M400 52v148" stroke="#2B3039" stroke-width="5"/>

  <!-- Pantalla -->
  <path d="M330 268l70-70 70 70z" fill="#2B3039"/>
  <ellipse cx="400" cy="268" rx="70" ry="14" fill="#3A414C"/>

  <!-- Bombilla y cono de luz -->
  <circle cx="400" cy="284" r="17" fill="#FFE0B0"/>
  <path d="M400 288l-176 162h352z" fill="url(#ld-g)"/>

  <!-- Mesa iluminada -->
  <rect x="266" y="404" width="268" height="14" rx="6" fill="#C09A6E"/>
  <rect x="290" y="418" width="14" height="32" fill="#B08A5E"/>
  <rect x="496" y="418" width="14" height="32" fill="#B08A5E"/>

  <!-- Etiqueta regulable -->
  <g transform="translate(596 300)">
    <rect width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E0DBD2" stroke-width="2"/>
    <circle cx="26" cy="20" r="9" fill="#F97316"/>
    <text x="46" y="26" font-family="Inter, sans-serif" font-size="14" fill="#4A4F58">Regulable</text>
  </g>
</svg>

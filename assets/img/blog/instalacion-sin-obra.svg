<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Dos formas de renovar la instalación sin picar: a la izquierda, el cable nuevo se ata al viejo y se pasa por el tubo corrugado que ya hay dentro de la pared; a la derecha, cuando no hay tubo, la línea nueva va vista en canaleta por el rodapié hasta el enchufe">
  <defs>
    <linearGradient id="so-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7F3"/><stop offset="1" stop-color="#F0EBE4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#so-bg)"/>

  <!-- ── A: por el tubo que ya hay ─────────────────────────── -->
  <text x="40" y="42" font-family="Archivo, Inter, sans-serif" font-size="16" font-weight="700" fill="#3A3E46">A · Por el tubo que ya hay</text>
  <text x="40" y="64" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">El cable viejo tira del nuevo. Sin tocar la pared.</text>

  <rect x="40" y="86" width="330" height="250" rx="12" fill="#FFFFFF"/>
  <rect x="40" y="86" width="330" height="250" rx="12" fill="none" stroke="#E0DBD2" stroke-width="3"/>

  <!-- Pared con tubo corrugado -->
  <rect x="70" y="120" width="270" height="70" rx="10" fill="#EDE7DD" stroke="#D6D0C6" stroke-width="2"/>
  <path d="M86 155q10 -12 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0"
        fill="none" stroke="#C8C3BA" stroke-width="10" stroke-linecap="round"/>
  <text x="70" y="112" font-family="Inter, sans-serif" font-size="12" fill="#8A8E96">Tubo corrugado dentro de la pared</text>

  <!-- Cable viejo saliendo y nuevo entrando -->
  <path d="M86 155h120" stroke="#8A8E96" stroke-width="6" stroke-linecap="round"/>
  <path d="M206 155h134" stroke="#F2A81C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="206" cy="155" r="9" fill="#FFFFFF" stroke="#F2A81C" stroke-width="3"/>
  <text x="70" y="216" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">Cable viejo</text>
  <text x="250" y="216" font-family="Inter, sans-serif" font-size="13" fill="#9A6A05" font-weight="600">Cable nuevo</text>
  <text x="70" y="242" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46">Se atan por el punto de unión y, al tirar</text>
  <text x="70" y="260" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46">del viejo, el nuevo ocupa su sitio.</text>
  <text x="70" y="292" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">Se aprovecha para subir la sección</text>
  <text x="70" y="310" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">y para meter el cable de tierra.</text>

  <!-- ── B: canaleta cuando no hay tubo ────────────────────── -->
  <text x="420" y="42" font-family="Archivo, Inter, sans-serif" font-size="16" font-weight="700" fill="#3A3E46">B · Si no hay tubo, por fuera</text>
  <text x="420" y="64" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">Canaleta o rodapié, pintados del color de la pared.</text>

  <rect x="420" y="86" width="340" height="250" rx="12" fill="#FFFFFF"/>
  <rect x="420" y="86" width="340" height="250" rx="12" fill="none" stroke="#E0DBD2" stroke-width="3"/>

  <!-- Cuadro -->
  <rect x="446" y="118" width="70" height="56" rx="8" fill="#FFFFFF" stroke="#C8C3BA" stroke-width="3"/>
  <path d="M460 132v28M476 132v28M492 132v28" stroke="#C8C3BA" stroke-width="5" stroke-linecap="round"/>
  <text x="446" y="110" font-family="Inter, sans-serif" font-size="12" fill="#8A8E96">Cuadro nuevo</text>

  <!-- Rodapié con la línea -->
  <rect x="440" y="268" width="300" height="20" rx="6" fill="#F7F4EF" stroke="#C8C3BA" stroke-width="3"/>
  <path d="M481 174v94h240" stroke="#F2A81C" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Enchufe -->
  <rect x="700" y="216" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#C8C3BA" stroke-width="3"/>
  <circle cx="713" cy="238" r="4" fill="#C8C3BA"/>
  <circle cx="731" cy="238" r="4" fill="#C8C3BA"/>
  <path d="M721 268v-8" stroke="#F2A81C" stroke-width="6" stroke-linecap="round"/>

  <text x="440" y="316" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46">Enchufes nuevos donde hacen falta, sin</text>
  <text x="440" y="334" font-family="Inter, sans-serif" font-size="13" fill="#3A3E46">rozas, sin polvo y en el mismo día.</text>
</svg>

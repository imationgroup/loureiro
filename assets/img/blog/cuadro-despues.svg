<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de un cuadro eléctrico moderno con automáticos y diferencial en carril DIN">
  <rect width="800" height="450" fill="#F4F1EC"/>

  <!-- Caja -->
  <rect x="176" y="70" width="448" height="310" rx="10" fill="#FFFFFF"/>
  <rect x="176" y="70" width="448" height="310" rx="10" fill="none" stroke="#D6D1C8" stroke-width="4"/>
  <rect x="176" y="70" width="448" height="40" rx="10" fill="#2B3039"/>
  <text x="200" y="97" font-family="Inter, sans-serif" font-size="17" fill="#FFFFFF">Cuadro general</text>
  <circle cx="596" cy="90" r="7" fill="#4ADE80"/>

  <!-- Carril DIN 1 -->
  <rect x="200" y="140" width="400" height="8" rx="2" fill="#C8C3BA"/>
  <g>
    <!-- IGA -->
    <rect x="204" y="148" width="52" height="76" rx="4" fill="#2B3039"/>
    <rect x="216" y="160" width="28" height="30" rx="3" fill="#F97316"/>
    <rect x="220" y="198" width="20" height="8" rx="4" fill="#8B93A0"/>
    <!-- Diferencial -->
    <rect x="264" y="148" width="76" height="76" rx="4" fill="#3A414C"/>
    <rect x="278" y="160" width="48" height="30" rx="3" fill="#E8E3DA"/>
    <circle cx="302" cy="205" r="9" fill="#F97316"/>
    <text x="302" y="209" font-family="Inter, sans-serif" font-size="11" fill="#fff" text-anchor="middle">T</text>
    <!-- Automáticos -->
    <g fill="#4A515C">
      <rect x="352" y="148" width="34" height="76" rx="4"/>
      <rect x="394" y="148" width="34" height="76" rx="4"/>
      <rect x="436" y="148" width="34" height="76" rx="4"/>
      <rect x="478" y="148" width="34" height="76" rx="4"/>
      <rect x="520" y="148" width="34" height="76" rx="4"/>
      <rect x="562" y="148" width="34" height="76" rx="4"/>
    </g>
    <g fill="#E8E3DA">
      <rect x="360" y="160" width="18" height="26" rx="2"/><rect x="402" y="160" width="18" height="26" rx="2"/>
      <rect x="444" y="160" width="18" height="26" rx="2"/><rect x="486" y="160" width="18" height="26" rx="2"/>
      <rect x="528" y="160" width="18" height="26" rx="2"/><rect x="570" y="160" width="18" height="26" rx="2"/>
    </g>
    <g fill="#9AA0AA">
      <rect x="363" y="198" width="12" height="7" rx="3"/><rect x="405" y="198" width="12" height="7" rx="3"/>
      <rect x="447" y="198" width="12" height="7" rx="3"/><rect x="489" y="198" width="12" height="7" rx="3"/>
      <rect x="531" y="198" width="12" height="7" rx="3"/><rect x="573" y="198" width="12" height="7" rx="3"/>
    </g>
  </g>

  <!-- Etiquetas -->
  <rect x="200" y="238" width="400" height="30" rx="5" fill="#F4F1EC"/>
  <g font-family="Inter, sans-serif" font-size="10" fill="#6C7079">
    <text x="228" y="257" text-anchor="middle">GEN</text>
    <text x="302" y="257" text-anchor="middle">DIFER.</text>
    <text x="369" y="257" text-anchor="middle">LUZ</text>
    <text x="411" y="257" text-anchor="middle">ENCH</text>
    <text x="453" y="257" text-anchor="middle">COCI</text>
    <text x="495" y="257" text-anchor="middle">BAÑO</text>
    <text x="537" y="257" text-anchor="middle">A/A</text>
    <text x="579" y="257" text-anchor="middle">LAV</text>
  </g>

  <!-- Cableado ordenado con peine -->
  <rect x="200" y="286" width="400" height="10" rx="3" fill="#F97316" opacity=".85"/>
  <g stroke="#C8C3BA" stroke-width="3">
    <path d="M228 268v18M302 268v18M369 268v18M411 268v18M453 268v18M495 268v18M537 268v18M579 268v18"/>
  </g>
  <g stroke="#8B93A0" stroke-width="3" stroke-linecap="round">
    <path d="M228 296v56M302 296v56M369 296v56M411 296v56M453 296v56M495 296v56M537 296v56M579 296v56"/>
  </g>

  <!-- Toma de tierra -->
  <g transform="translate(646 300)">
    <path d="M22 0v26" stroke="#5C7F5A" stroke-width="4"/>
    <path d="M4 26h36M10 34h24M16 42h12" stroke="#5C7F5A" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de una estufa de pellets encendida con su salida de humos, un saco de pellets y la potencia en kilovatios">
  <defs>
    <linearGradient id="ep-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7F3"/><stop offset="1" stop-color="#F0EBE4"/>
    </linearGradient>
    <linearGradient id="ep-llama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F2A81C"/><stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ep-w)"/>
  <rect y="372" width="800" height="78" fill="#E3DCD1"/>
  <g stroke="#D6CEC0" stroke-width="2"><path d="M0 372h800M0 412h800"/><path d="M160 372v78M400 372v78M640 372v78"/></g>

  <!-- Salida de humos -->
  <path d="M300 96v70" stroke="#8B93A0" stroke-width="16" stroke-linecap="round"/>
  <path d="M300 96v70" stroke="#6F7681" stroke-width="4" stroke-dasharray="2 26"/>
  <g fill="#C8C3BA" opacity=".55">
    <circle cx="330" cy="86" r="11"/><circle cx="352" cy="66" r="8"/><circle cx="312" cy="62" r="6"/>
  </g>

  <!-- Estufa -->
  <rect x="236" y="166" width="128" height="206" rx="14" fill="#2B3039"/>
  <rect x="236" y="166" width="128" height="206" rx="14" fill="none" stroke="#1B2027" stroke-width="3"/>
  <rect x="248" y="178" width="104" height="22" rx="6" fill="#3A414C"/>
  <circle cx="264" cy="189" r="4" fill="#4ADE80"/>
  <rect x="284" y="185" width="56" height="8" rx="4" fill="#5A626E"/>

  <!-- Cristal y fuego -->
  <rect x="252" y="212" width="96" height="104" rx="8" fill="#1E2533"/>
  <rect x="252" y="212" width="96" height="104" rx="8" fill="none" stroke="#4A515C" stroke-width="3"/>
  <path d="M300 300c-22 0-34-14-34-30 0-18 14-24 20-40 4 12 12 14 16 22 4-8 6-14 6-22 10 10 26 24 26 40 0 16-12 30-34 30z" fill="url(#ep-llama)"/>
  <path d="M300 296c-10 0-16-8-16-16 0-10 8-14 10-24 6 8 22 16 22 24 0 8-6 16-16 16z" fill="#FDE68A" opacity=".85"/>

  <!-- Cajón de cenizas y patas -->
  <rect x="252" y="328" width="96" height="22" rx="5" fill="#3A414C"/>
  <rect x="288" y="335" width="24" height="7" rx="3.5" fill="#6F7681"/>
  <path d="M256 372v-10M344 372v-10" stroke="#1B2027" stroke-width="8" stroke-linecap="round"/>

  <!-- Calor que sale -->
  <g stroke="#F2A81C" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M380 236h34M380 258h48M380 280h34"/>
    <path d="M406 230l10 6-10 6M420 252l10 6-10 6M406 274l10 6-10 6" fill="none"/>
  </g>

  <!-- Saco de pellets -->
  <path d="M96 268h108v88a10 10 0 0 1-10 10h-88a10 10 0 0 1-10-10z" fill="#D9B98C"/>
  <path d="M96 268h108v88a10 10 0 0 1-10 10h-88a10 10 0 0 1-10-10z" fill="none" stroke="#C9A677" stroke-width="3"/>
  <path d="M96 268c16-12 92-12 108 0" fill="#C9A677"/>
  <rect x="118" y="296" width="64" height="34" rx="5" fill="#FFFFFF"/>
  <text x="150" y="319" font-family="Inter, sans-serif" font-size="15" fill="#6B7180" text-anchor="middle">15 kg</text>
  <!-- Pellets sueltos -->
  <g fill="#C9A677">
    <rect x="206" y="352" width="16" height="7" rx="3.5" transform="rotate(-18 214 355)"/>
    <rect x="224" y="360" width="16" height="7" rx="3.5" transform="rotate(12 232 363)"/>
    <rect x="200" y="366" width="16" height="7" rx="3.5"/>
  </g>

  <!-- Potencia -->
  <g transform="translate(470 150)">
    <rect width="250" height="96" rx="12" fill="#FFFFFF"/>
    <rect width="250" height="96" rx="12" fill="none" stroke="#E0DBD2" stroke-width="3"/>
    <text x="24" y="36" font-family="Inter, sans-serif" font-size="14" fill="#6B7180">Potencia para la casa</text>
    <text x="24" y="74" font-family="Inter, sans-serif" font-size="30" fill="#1E2533" font-weight="bold">8 kW</text>
    <text x="120" y="74" font-family="Inter, sans-serif" font-size="15" fill="#8A8E96">≈ 80 m²</text>
  </g>

  <!-- Mantenimiento -->
  <g transform="translate(470 286)">
    <circle cx="20" cy="20" r="20" fill="#5C7F5A"/>
    <path d="M11 21l6 6 13-14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="27" font-family="Inter, sans-serif" font-size="17" fill="#4A4F58">Limpieza y revisión anual</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de una casa con placas solares en el faldón del tejado, inversor en la fachada, batería y un gráfico con la producción">
  <defs>
    <linearGradient id="ps-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7F3"/><stop offset="1" stop-color="#F0EBE4"/>
    </linearGradient>
    <linearGradient id="ps-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31465E"/><stop offset="1" stop-color="#22303F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ps-w)"/>

  <!-- Sol -->
  <circle cx="648" cy="98" r="42" fill="#FFD9A8" opacity=".5"/>
  <circle cx="648" cy="98" r="26" fill="#F97316"/>
  <g stroke="#F97316" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M648 36v-14M648 174v14M710 98h14M572 98h14M693 53l10-10M593 143l-10 10M693 143l10 10M593 53l-10-10"/>
  </g>

  <!-- Suelo -->
  <rect y="372" width="800" height="78" fill="#E3DCD1"/>

  <!-- Casa -->
  <rect x="150" y="252" width="300" height="120" fill="#FFFFFF"/>
  <rect x="150" y="252" width="300" height="120" fill="none" stroke="#E0DBD2" stroke-width="3"/>

  <!-- Tejado a dos aguas -->
  <path d="M100 252 L300 118 L500 252 Z" fill="#C9C2B6"/>
  <path d="M100 252 L300 118 L500 252 Z" fill="none" stroke="#B4AC9E" stroke-width="3" stroke-linejoin="round"/>

  <!-- Placas sobre el faldón derecho, giradas con la pendiente del tejado -->
  <!-- El scale(1 .9) es el escorzo: el faldón se ve inclinado, así que las
       placas quedan algo más achatadas de lo que son. -->
  <g transform="translate(352 155) rotate(34.4) scale(1 .9)">
    <rect x="-3" y="-1" width="118" height="41" rx="4" fill="#1B2734"/>
    <g fill="url(#ps-panel)">
      <rect x="0" y="2" width="34" height="16" rx="2"/><rect x="39" y="2" width="34" height="16" rx="2"/><rect x="78" y="2" width="34" height="16" rx="2"/>
      <rect x="0" y="21" width="34" height="16" rx="2"/><rect x="39" y="21" width="34" height="16" rx="2"/><rect x="78" y="21" width="34" height="16" rx="2"/>
    </g>
    <g stroke="#5B7590" stroke-width="1.1" opacity=".85">
      <path d="M17 2v16M17 21v16M56 2v16M56 21v16M95 2v16M95 21v16"/>
      <path d="M0 10h34M39 10h34M78 10h34M0 29h34M39 29h34M78 29h34"/>
    </g>
    <!-- Brillo del sol en el cristal -->
    <path d="M0 2h26l-16 35H0z" fill="#FFFFFF" opacity=".13"/>
  </g>

  <!-- Bajante de la instalación hasta el inversor -->
  <path d="M420 250 V 266 H 307 V 278" stroke="#C8C3BA" stroke-width="6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ventana y puerta -->
  <rect x="180" y="278" width="62" height="52" rx="4" fill="#BBD4E0"/>
  <rect x="180" y="278" width="62" height="52" rx="4" fill="none" stroke="#2B3039" stroke-width="4"/>
  <path d="M211 278v52M180 304h62" stroke="#2B3039" stroke-width="3"/>
  <rect x="368" y="292" width="58" height="80" rx="4" fill="#2B3039"/>
  <circle cx="382" cy="334" r="4" fill="#F97316"/>

  <!-- Inversor en la fachada -->
  <rect x="280" y="278" width="54" height="68" rx="6" fill="#FFFFFF"/>
  <rect x="280" y="278" width="54" height="68" rx="6" fill="none" stroke="#E0DBD2" stroke-width="2"/>
  <rect x="280" y="278" width="54" height="16" rx="6" fill="#2B3039"/>
  <rect x="280" y="288" width="54" height="6" fill="#2B3039"/>
  <rect x="291" y="302" width="32" height="18" rx="3" fill="#E8E3DA"/>
  <path d="M297 311h20" stroke="#8B93A0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="297" cy="334" r="4" fill="#4ADE80"/>
  <circle cx="311" cy="334" r="4" fill="#F97316"/>

  <!-- La energía va a la casa y a la batería -->
  <g stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 244 C 498 258 508 268 514 286"/>
    <path d="M504 274l10 14 10-12"/>
  </g>

  <!-- Batería -->
  <rect x="490" y="296" width="66" height="76" rx="8" fill="#FFFFFF"/>
  <rect x="490" y="296" width="66" height="76" rx="8" fill="none" stroke="#E0DBD2" stroke-width="3"/>
  <rect x="502" y="310" width="42" height="10" rx="5" fill="#4ADE80"/>
  <rect x="502" y="326" width="42" height="10" rx="5" fill="#4ADE80"/>
  <rect x="502" y="342" width="42" height="10" rx="5" fill="#E8E3DA"/>
  <text x="523" y="366" font-family="Inter, sans-serif" font-size="12" fill="#6C7079" text-anchor="middle">Batería</text>

  <!-- Producción medida -->
  <g transform="translate(600 186)">
    <rect width="150" height="96" rx="10" fill="#FFFFFF"/>
    <rect width="150" height="96" rx="10" fill="none" stroke="#E0DBD2" stroke-width="3"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="12" fill="#6C7079">Producción</text>
    <g fill="#F6BE8C">
      <rect x="16" y="52" width="16" height="24" rx="3"/>
      <rect x="40" y="42" width="16" height="34" rx="3"/>
    </g>
    <g fill="#F97316">
      <rect x="64" y="34" width="16" height="42" rx="3"/>
      <rect x="88" y="44" width="16" height="32" rx="3"/>
      <rect x="112" y="56" width="16" height="20" rx="3"/>
    </g>
    <path d="M16 82h118" stroke="#E0DBD2" stroke-width="2"/>
  </g>

  <!-- Revisada -->
  <g transform="translate(600 312)">
    <circle cx="22" cy="22" r="22" fill="#5C7F5A"/>
    <path d="M12 23l7 7 14-15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="29" font-family="Inter, sans-serif" font-size="17" fill="#4A4F58">Revisada</text>
  </g>

  <!-- Arbusto -->
  <path d="M96 372c0-24 16-38 32-38s32 14 32 38z" fill="#5C7F5A"/>
  <path d="M120 372c0-16 11-26 22-26s22 10 22 26z" fill="#6E9469"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de un cuadro eléctrico antiguo de fusibles de porcelana">
  <rect width="800" height="450" fill="#BEB7AD"/>
  <ellipse cx="120" cy="90" rx="90" ry="56" fill="#ADA69B" opacity=".6"/>
  <ellipse cx="690" cy="380" rx="100" ry="52" fill="#ADA69B" opacity=".5"/>

  <!-- Tabla de madera -->
  <rect x="196" y="86" width="408" height="278" rx="4" fill="#8B7355"/>
  <rect x="196" y="86" width="408" height="278" rx="4" fill="none" stroke="#6F5B43" stroke-width="6"/>
  <g stroke="#7A6446" stroke-width="2" opacity=".7">
    <path d="M196 150h408M196 232h408M196 300h408"/>
  </g>

  <!-- Fusibles de porcelana -->
  <g>
    <circle cx="266" cy="150" r="30" fill="#E6DED2"/><circle cx="266" cy="150" r="13" fill="#8A7F70"/>
    <circle cx="352" cy="150" r="30" fill="#E6DED2"/><circle cx="352" cy="150" r="13" fill="#8A7F70"/>
    <circle cx="438" cy="150" r="30" fill="#DDD3C4"/><circle cx="438" cy="150" r="13" fill="#6E6458"/>
    <circle cx="524" cy="150" r="30" fill="#E6DED2"/><circle cx="524" cy="150" r="13" fill="#8A7F70"/>
  </g>

  <!-- Interruptor de cuchillas viejo -->
  <rect x="250" y="238" width="128" height="54" rx="3" fill="#5E5348"/>
  <path d="M266 265h96" stroke="#B9AC9A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="266" cy="265" r="8" fill="#C9BCA8"/>

  <!-- Empalmes con cinta -->
  <rect x="418" y="238" width="150" height="54" rx="3" fill="#6B6055"/>
  <g stroke="#3F3830" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M432 252c22 14 40-10 60 6s38-4 58 8"/>
  </g>
  <rect x="470" y="244" width="26" height="16" rx="3" fill="#4A423A"/>
  <rect x="516" y="256" width="26" height="16" rx="3" fill="#4A423A"/>

  <!-- Cables sueltos colgando -->
  <g fill="none" stroke="#4E463D" stroke-width="5" stroke-linecap="round">
    <path d="M300 364c0 40-24 40-24 72"/>
    <path d="M400 364c6 34 26 30 26 64"/>
    <path d="M498 364c-4 30-30 26-30 58"/>
  </g>

  <!-- Sin toma de tierra: aviso -->
  <g transform="translate(624 300)">
    <path d="M28 0 56 48H0z" fill="#C2410C"/>
    <path d="M28 16v18M28 40v4" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

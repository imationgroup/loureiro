<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de enchufes e interruptores antiguos, amarilleados y sin toma de tierra">
  <rect width="800" height="450" fill="#C6BFB4"/>
  <ellipse cx="660" cy="110" rx="110" ry="66" fill="#B4ADA1" opacity=".55"/>
  <path d="M96 40c26 40 6 70 30 106" fill="none" stroke="#A79F92" stroke-width="4" stroke-linecap="round"/>

  <!-- Interruptor de tecla vieja -->
  <g transform="translate(150 120)">
    <rect width="150" height="150" rx="8" fill="#D8CDB6"/>
    <rect width="150" height="150" rx="8" fill="none" stroke="#A99C80" stroke-width="4"/>
    <rect x="34" y="30" width="82" height="90" rx="5" fill="#C9BC9F"/>
    <path d="M34 75h82" stroke="#A99C80" stroke-width="3"/>
    <circle cx="20" cy="20" r="4" fill="#9A8E74"/><circle cx="130" cy="130" r="4" fill="#9A8E74"/>
  </g>

  <!-- Enchufe amarilleado sin tierra -->
  <g transform="translate(360 120)">
    <rect width="150" height="150" rx="8" fill="#DDD2B8"/>
    <rect width="150" height="150" rx="8" fill="none" stroke="#A99C80" stroke-width="4"/>
    <circle cx="75" cy="75" r="52" fill="#CCC0A4"/>
    <circle cx="56" cy="75" r="9" fill="#5E5648"/>
    <circle cx="94" cy="75" r="9" fill="#5E5648"/>
    <!-- marca de quemado -->
    <path d="M94 75c14 8 20-6 26 4" stroke="#6E5A3E" stroke-width="4" fill="none"/>
    <ellipse cx="104" cy="88" rx="22" ry="14" fill="#8A7452" opacity=".5"/>
  </g>

  <!-- Enchufe suelto colgando -->
  <g transform="translate(570 120)">
    <rect width="150" height="150" rx="8" fill="#D8CDB6" transform="rotate(-9 75 75)"/>
    <rect width="150" height="150" rx="8" fill="none" stroke="#A99C80" stroke-width="4" transform="rotate(-9 75 75)"/>
    <circle cx="75" cy="75" r="46" fill="#C4B99D" transform="rotate(-9 75 75)"/>
    <circle cx="58" cy="72" r="8" fill="#5E5648"/><circle cx="94" cy="78" r="8" fill="#5E5648"/>
  </g>
  <path d="M646 270c0 40 18 40 18 76" fill="none" stroke="#5E5648" stroke-width="6" stroke-linecap="round"/>

  <!-- Aviso sin tierra -->
  <g transform="translate(94 320)">
    <path d="M28 0 56 48H0z" fill="#C2410C"/>
    <path d="M28 16v18M28 40v4" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="166" y="352" font-family="Inter, sans-serif" font-size="19" fill="#6B6255">Sin toma de tierra</text>
</svg>

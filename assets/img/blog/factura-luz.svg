<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustración de una factura de la luz revisada con lupa, con la potencia contratada marcada y los periodos punta, llano y valle">
  <rect width="800" height="450" fill="#F4F1EC"/>

  <!-- Factura -->
  <g>
    <rect x="96" y="54" width="330" height="352" rx="10" fill="#FFFFFF"/>
    <rect x="96" y="54" width="330" height="352" rx="10" fill="none" stroke="#E0DBD2" stroke-width="3"/>
    <rect x="96" y="54" width="330" height="46" rx="10" fill="#2B3039"/>
    <rect x="96" y="84" width="330" height="16" fill="#2B3039"/>
    <text x="122" y="84" font-family="Inter, sans-serif" font-size="17" fill="#FFFFFF">Factura de la luz</text>

    <!-- Líneas de concepto -->
    <g fill="#E8E3DA">
      <rect x="122" y="128" width="160" height="9" rx="4.5"/>
      <rect x="122" y="196" width="132" height="9" rx="4.5"/>
      <rect x="122" y="228" width="176" height="9" rx="4.5"/>
      <rect x="122" y="260" width="148" height="9" rx="4.5"/>
    </g>
    <g fill="#D6D1C8">
      <rect x="330" y="128" width="70" height="9" rx="4.5"/>
      <rect x="330" y="196" width="70" height="9" rx="4.5"/>
      <rect x="330" y="228" width="70" height="9" rx="4.5"/>
      <rect x="330" y="260" width="70" height="9" rx="4.5"/>
    </g>

    <!-- Línea marcada: la potencia -->
    <rect x="110" y="148" width="302" height="34" rx="6" fill="#FDEBD9"/>
    <rect x="110" y="148" width="4" height="34" rx="2" fill="#F97316"/>
    <text x="122" y="170" font-family="Inter, sans-serif" font-size="14" fill="#8A4A16">Potencia contratada</text>
    <rect x="330" y="160" width="70" height="9" rx="4.5" fill="#F6BE8C"/>

    <!-- Total -->
    <rect x="122" y="300" width="278" height="1.5" fill="#E0DBD2"/>
    <text x="122" y="332" font-family="Inter, sans-serif" font-size="15" fill="#6C7079">Total</text>
    <rect x="300" y="320" width="100" height="14" rx="7" fill="#C8C3BA"/>
    <rect x="122" y="364" width="120" height="8" rx="4" fill="#EFEBE4"/>
  </g>

  <!-- Lupa -->
  <g>
    <circle cx="392" cy="238" r="74" fill="#FFFFFF" opacity=".35"/>
    <circle cx="392" cy="238" r="74" fill="none" stroke="#2B3039" stroke-width="9"/>
    <circle cx="392" cy="238" r="62" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".7"/>
    <path d="M444 290l46 46" stroke="#2B3039" stroke-width="16" stroke-linecap="round"/>
    <path d="M444 290l46 46" stroke="#4A515C" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Periodos: punta, llano y valle -->
  <g>
    <text x="556" y="96" font-family="Inter, sans-serif" font-size="15" fill="#6C7079">Cuándo consumes</text>
    <rect x="556" y="120" width="160" height="10" rx="5" fill="#EFEBE4"/>

    <rect x="556" y="150" width="150" height="30" rx="6" fill="#F97316"/>
    <text x="568" y="170" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF">Punta</text>

    <rect x="556" y="192" width="104" height="30" rx="6" fill="#F6BE8C"/>
    <text x="568" y="212" font-family="Inter, sans-serif" font-size="14" fill="#7A3F12">Llano</text>

    <rect x="556" y="234" width="62" height="30" rx="6" fill="#5C7F5A"/>
    <text x="568" y="254" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF">Valle</text>

    <text x="556" y="300" font-family="Inter, sans-serif" font-size="13" fill="#8A8E96">Lo que pagas por el mismo kWh</text>
  </g>

  <!-- Ahorro -->
  <g transform="translate(556 330)">
    <circle cx="22" cy="22" r="22" fill="#5C7F5A"/>
    <path d="M12 23l7 7 14-15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="29" font-family="Inter, sans-serif" font-size="17" fill="#4A4F58">Menos cada mes</text>
  </g>
</svg>
